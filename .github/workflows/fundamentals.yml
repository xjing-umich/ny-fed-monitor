name: Daily Fundamentals (full holdings)
on:
  # SEC EDGAR companyfacts → fundamentals for the FULL 13F holdings universe
  # (consensus_holdings ∩ SEC US-company map, ~1.6k companies, ~35-40min).
  # Idempotent per ticker; the universe is read live each run so newly-held
  # names are auto-covered. Check each weekday during filing season; keep Saturday full refresh.
  # No 300s limit on Actions (the Vercel cron only covers the hardcoded core).
  schedule:
    - cron: "0 7 * * 1-6"   # Mon–Sat 07:00 UTC, before valuation at 12:00 UTC
  workflow_dispatch: {}
concurrency:
  group: sec-fundamentals
  cancel-in-progress: false
jobs:
  fundamentals:
    runs-on: ubuntu-latest
    outputs:
      changed_tickers: ${{ steps.ingest.outputs.changed_tickers }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: web
      - id: ingest
        run: npm run sec:ingest:holdings
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # SEC requires a contact User-Agent. Uses the repo secret if set, else a default contact.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Compounder Research junlinzhu@jobright.ai' }}

      - name: Publish changed financial pages
        if: ${{ always() && steps.ingest.outputs.changed_tickers != '' && steps.ingest.outputs.changed_tickers != '[]' }}
        run: npx tsx --tsconfig scripts/tsconfig.json scripts/revalidate-fundamentals.ts
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}

  valuation:
    needs: fundamentals
    if: ${{ needs.fundamentals.result == 'success' && needs.fundamentals.outputs.changed_tickers != '' && needs.fundamentals.outputs.changed_tickers != '[]' }}
    runs-on: ubuntu-latest
    concurrency:
      group: valuation-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: web
      - id: valuation
        run: npm run valuation:ingest
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Publish valuation pages
        if: ${{ success() || (steps.valuation.outputs.cache_refresh_required != '' && steps.valuation.outputs.cache_refresh_required != '0') }}
        run: npm run valuation:revalidate
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
