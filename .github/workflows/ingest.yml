name: 13F Ingest (Mon & Thu, twice daily in filing season)
on:
  schedule:
    # 错开整点::00 是 GitHub 定时任务最拥挤的时刻,2026-08~10 实测 09:00 的任务普遍晚 5–10 小时才启动。
    - cron: "17 9 * * 1,4"    # 每周一/周四 09:17 UTC; 派生内容未变时不整站刷新。13F 为命脉
    # 申报季(2/5/8/11 月 10–20 日)每天两次:03:17 UTC 接住前一晚(美东傍晚)的申报,15:17 UTC 接住
    # 当天上午的。看门狗在申报季要求 30 小时内必须有一次成功(src/lib/health/checks.ts isFilingSeason)。
    - cron: "17 3,15 10-20 2,5,8,11 *"
  workflow_dispatch: {}
# 申报季的周一/周四两条 cron 会在同一分钟触发:两次 ingest 并发会交错 delete/insert holdings,
# 污染共识表与报告 payload、重复发预览。排队执行,不取消正在跑的。
concurrency: { group: ingest-13f, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: web
      - id: ingest
        run: npm run ingest
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
      # 数据入库 ≠ 页面生效。不刷缓存的话页面只能等各自的 ISR 到期(详情页 7 天),申报季会长时间
      # 半新半旧。失败即红灯(不 continue-on-error):站点继续发旧数据是真故障,不该静默。
      # 只在新 filing/派生内容实质变化(或手动触发)时刷;纯时间戳变化不刷。整站刷新约 2200 页,无差别每周两次
      # 会把 Vercel Hobby 的 ISR Writes 额度用穿。
      - name: Revalidate site cache
        id: revalidate
        if: steps.ingest.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS -X POST "https://thecompounder.fyi/api/revalidate?source=13f" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}"
          echo
      # 季度报告:payload 不变则不写不刷;变化时只刷 learn(source=report),不触发整站重建。
      # 失败即红灯(continue-on-error 保持默认 false)。
      - id: report
        run: npm run report
        working-directory: web
        continue-on-error: false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_ALERTS_TO: ${{ secrets.RESEND_ALERTS_TO }}
          RESEND_ALERTS_FROM: ${{ secrets.RESEND_ALERTS_FROM }}
          NEWSLETTER_POSTAL_ADDRESS: ${{ secrets.NEWSLETTER_POSTAL_ADDRESS }}
      # always(): report.ts 在可能抛错的预览发送前就已写入 report_changed=true;
      # 预览失败也必须刷新报告页,否则页面会陈旧。
      - name: Revalidate report pages
        if: always() && steps.report.outputs.report_changed == 'true'
        run: |
          curl -fsS -X POST "https://thecompounder.fyi/api/revalidate?source=report" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}"
          echo
      # 运行记录(看门狗用):always() —— 任何一步失败都要记下来。2026-08~10 定时 ingest 连红 17 次无人知晓,
      # 因为看门狗看不到工作流本身。记账失败只打日志,不制造新的红灯。
      - name: Record run for watchdog
        if: always()
        run: npx tsx scripts/record-ingest-run.ts
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JOB_STATUS: ${{ job.status }}
          NEW_FILINGS: ${{ steps.ingest.outputs.new_filings }}
          MANAGERS_OK: ${{ steps.ingest.outputs.managers_ok }}
          STEP_OUTCOMES: "ingest=${{ steps.ingest.outcome }} revalidate=${{ steps.revalidate.outcome }} report=${{ steps.report.outcome }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_STARTED_AT: ${{ steps.start.outputs.at }}
