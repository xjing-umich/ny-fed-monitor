name: 13F Ingest (Mon & Thu)
on:
  schedule:
    - cron: "0 9 * * 1,4"    # 每周一/周四 09:00 UTC; 幂等(无新 filing 不写)。13F 为命脉,filing 季加密捕捉
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: web
      - id: ingest
        run: npm run ingest
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
      # 数据入库 ≠ 页面生效。不刷缓存的话页面只能等各自的 ISR 到期(详情页 7 天),申报季会长时间
      # 半新半旧。失败即红灯(不 continue-on-error):站点继续发旧数据是真故障,不该静默。
      # 只在本次有新 filing(或手动触发)时刷:整站刷新 = ~2200 页重新生成,无差别每周两次
      # 会把 Vercel Hobby 的 ISR Writes 额度用穿。
      - name: Revalidate site cache
        if: steps.ingest.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS -X POST "https://thecompounder.fyi/api/revalidate?source=13f" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}"
          echo
