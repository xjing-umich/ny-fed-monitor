name: Valuation Snapshot (daily)
on:
  schedule:
    # 每日 12:00 UTC：晚于 prices(工作日 22:00 UTC EOD 入库)与 SEC fundamentals(周更)，
    # 确保读到最新在库价格+基本面。幂等：逐 ticker upsert(onConflict=ticker)，重跑只覆盖。
    - cron: "0 12 * * *"
  workflow_dispatch: {}
jobs:
  valuation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: web
      - run: npm run valuation:ingest
        working-directory: web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # 同 ingest.yml:快照重算完必须刷缓存,否则个股页/screener 继续发旧估值。
      # 但只在每周六(当周 SEC fundamentals 已于周六 07:00 入库)或手动触发时整站刷新:
      # 每日整站刷新 = 每天 ~2200 页重新生成,是 Vercel Hobby ISR Writes 超额的主因。
      # 其余日子的快照照常入库,页面在下一次周六刷新或 ISR 到期时生效。
      - name: Revalidate site cache
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%u)" != "6" ]; then
            echo "Skip: weekly site refresh runs on Saturdays (UTC)."
            exit 0
          fi
          curl -fsS -X POST "https://thecompounder.fyi/api/revalidate?source=valuation" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}"
          echo
